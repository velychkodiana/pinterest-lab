[pytest]
testpaths = tests
pythonpath = .
addopts = -v --html=reports/report.html --self-contained-html --tracing=retain-on-failure --screenshot=only-on-failure --output=reports/artifacts
markers =
    smoke: критичні перевірки
    auth: модуль автентифікації
    search: модуль пошуку
    pins: піни та дошки
    negative: негативні сценарії
    boundary: граничні значення
